[package]
name = "runvideo"
version = "0.1.0"
edition = "2021"
description = "A simple, fast, layer-based video editor built with Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
