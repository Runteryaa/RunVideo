name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install FFmpeg
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Run tests
        run: cargo test --release

      - name: Build release executable
        run: cargo build --release --locked

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/runvideo.exe dist/runvideo.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/runvideo.exe, dist/README.md -DestinationPath dist/runvideo-windows-x86_64.zip -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: runvideo-windows-x86_64
          path: |
            dist/runvideo.exe
            dist/runvideo-windows-x86_64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: RunVideo ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Windows build of RunVideo.

            **Requirements:** FFmpeg (`ffmpeg` and `ffprobe`) must be on your `PATH`.

            Download `runvideo.exe` below, or the zip if you also want the README.
          files: |
            dist/runvideo.exe
            dist/runvideo-windows-x86_64.zip
          fail_on_unmatched_files: true
