name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Static MSVC runtime so the executable runs on Windows installs that do not
  # have the Visual C++ redistributable.
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP\ffmpeg -Force
          $bin = (Get-ChildItem $env:RUNNER_TEMP\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "FFMPEG_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$bin\ffmpeg.exe" -version | Select-Object -First 1
          & "$bin\ffprobe.exe" -version | Select-Object -First 1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Run tests
        run: cargo test --release

      - name: Build release executable
        run: cargo build --release --locked

      - name: Build installer and portable package
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag.TrimStart("v")
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & .\installer\build.ps1 -Version $version -FfmpegDir $env:FFMPEG_DIR -Iscc $iscc -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem dist -File | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: runvideo-windows-x86_64
          path: |
            target/release/runvideo.exe
            dist/RunVideo-*-setup.exe
            dist/RunVideo-*-portable.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: RunVideo ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Windows build of RunVideo.

            **Installer (recommended):** `RunVideo-${{ env.RELEASE_VERSION }}-setup.exe`
            installs RunVideo with everything it needs, including FFmpeg. No extra
            downloads or configuration required.

            **Portable:** `RunVideo-${{ env.RELEASE_VERSION }}-portable.zip` unpacks
            to a folder and runs from there; FFmpeg is included.

            **Standalone `runvideo.exe`:** only the editor itself. It needs FFmpeg
            and ffprobe either on your `PATH` or in a `ffmpeg\bin` folder next to
            the executable. Use the installer or the portable zip if you don't
            already have FFmpeg.
          files: |
            dist/RunVideo-*-setup.exe
            dist/RunVideo-*-portable.zip
            target/release/runvideo.exe
          fail_on_unmatched_files: true
